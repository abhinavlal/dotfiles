"$schema" = 'https://starship.rs/config-schema.json'

# ── Layout ────────────────────────────────────────────────────────────────────
# Two lines on purpose: line 1 is context, line 2 is yours. Long repo paths and
# long branch names never squeeze the space you actually type in.

format = """
[╭─](fg:overlay0)\
$username$hostname\
$directory\
$git_branch$git_state$git_status$git_metrics\
$python$nodejs$rust$golang$java$ruby$php$lua$deno$bun$zig\
$docker_context$kubernetes\
$jobs$battery$cmd_duration$status\
$line_break\
[╰─](fg:overlay0)$character"""

right_format = "$time"

add_newline = true
command_timeout = 1000
scan_timeout = 30

# ── Palette (Catppuccin Mocha) ────────────────────────────────────────────────
palette = "mocha"

[palettes.mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext0  = "#a6adc8"
overlay0  = "#6c7086"
surface1  = "#45475a"

# ── Who / where ───────────────────────────────────────────────────────────────
# Only shown over SSH — no point telling you you're you on your own laptop.

[username]
show_always = false
style_user = "fg:peach"
style_root = "fg:red bold"
format = "[$user]($style)[@](fg:overlay0)"

[hostname]
ssh_only = true
style = "fg:peach"
format = "[$hostname]($style) "

[directory]
style = "fg:blue"
before_repo_root_style = "fg:overlay0"
repo_root_style = "fg:blue bold"
format = "[ ](fg:blue)[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[ ](fg:blue)[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red"

[directory.substitutions]
"~/Code/Practo" = "󰢹 practo"
"~/Code" = " code"
"~/Documents" = "󰈙 docs"
"~/Downloads" = " dl"
"~/.config" = " config"

# ── Git ───────────────────────────────────────────────────────────────────────

[git_branch]
symbol = " "
style = "fg:mauve"
format = "[$symbol$branch]($style) "
truncation_length = 28
truncation_symbol = "…"

[git_state]
style = "fg:red bold"
format = "[\\($state( $progress_current/$progress_total)\\)]($style) "
rebase = "REBASING"
merge = "MERGING"
cherry_pick = "PICKING"
bisect = "BISECTING"
revert = "REVERTING"

[git_status]
style = "fg:yellow"
format = "[$all_status$ahead_behind]($style) "
conflicted = "󰞇 ${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰆓 ${count} "
modified = "✱${count} "
staged = "✚${count} "
renamed = "»${count} "
deleted = "✘${count} "
up_to_date = ""

[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# ── Languages — each only appears when the project actually uses it ───────────

[python]
symbol = " "
style = "fg:yellow"
format = "[$symbol$version]($style)[( \\($virtualenv\\))](fg:overlay0) "

[nodejs]
symbol = " "
style = "fg:green"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "fg:peach"
format = "[$symbol$version]($style) "

[golang]
symbol = " "
style = "fg:sky"
format = "[$symbol$version]($style) "

[java]
symbol = " "
style = "fg:maroon"
format = "[$symbol$version]($style) "

[ruby]
symbol = " "
style = "fg:red"
format = "[$symbol$version]($style) "

[php]
symbol = " "
style = "fg:lavender"
format = "[$symbol$version]($style) "

[lua]
symbol = " "
style = "fg:blue"
format = "[$symbol$version]($style) "

[deno]
symbol = " "
style = "fg:teal"
format = "[$symbol$version]($style) "

[bun]
symbol = " "
style = "fg:rosewater"
format = "[$symbol$version]($style) "

[zig]
symbol = " "
style = "fg:yellow"
format = "[$symbol$version]($style) "

# ── Infra ─────────────────────────────────────────────────────────────────────

[docker_context]
symbol = " "
style = "fg:sapphire"
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "fg:sapphire"
format = "[$symbol$context( \\($namespace\\))]($style) "
detect_files = ["Chart.yaml", "values.yaml", "skaffold.yaml", "kustomization.yaml"]
detect_folders = ["k8s", "kubernetes", ".helm", "helm-charts"]

# ── Signals ───────────────────────────────────────────────────────────────────

[cmd_duration]
min_time = 2000
style = "fg:overlay0"
format = "[󱎫 $duration]($style) "
show_milliseconds = false

[jobs]
symbol = "󰜎 "
style = "fg:teal"
format = "[$symbol$number]($style) "
number_threshold = 1
symbol_threshold = 1

[battery]
disabled = false
format = "[$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰁻 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 20
style = "fg:red bold"

[[battery.display]]
threshold = 40
style = "fg:yellow"

[status]
disabled = false
style = "fg:red bold"
symbol = "✘ "
not_executable_symbol = "󰂭 "
not_found_symbol = "󰍉 "
sigint_symbol = "󰜺 "
signal_symbol = "󱐋 "
format = "[$symbol$common_meaning$signal_name$maybe_int]($style) "
map_symbol = true
pipestatus = true

[time]
disabled = false
style = "fg:surface1"
format = "[$time]($style)"
time_format = "%H:%M:%S"

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
vimcmd_symbol = "[❮](bold fg:mauve)"

# ── Off on purpose: noisy, slow, or duplicated elsewhere ──────────────────────
[package]
disabled = true
[aws]
disabled = true
[gcloud]
disabled = true
[memory_usage]
disabled = true
[shlvl]
disabled = true
